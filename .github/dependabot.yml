version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    # Emits `chore(deps): bump ...`, which satisfies the PR title convention
    # enforced by .github/workflows/lint-pr.yml. See CONTRIBUTING.md.
    commit-message:
      prefix: 'chore'
      include: 'scope'
