name: "Build Docker Image"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Existing alpha version to publish as a Docker image"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "docker-image-alpha"
  cancel-in-progress: false

jobs:
  resolve-source:
    name: "Resolve release source"
    runs-on: "ubuntu-24.04"
    outputs:
      source_sha: "${{ steps.source.outputs.sha }}"

    steps:
      - name: "Checkout release tag"
        uses: "actions/checkout@v7"
        with:
          ref: "v${{ inputs.version }}"

      - name: "Verify release identity"
        id: source
        shell: bash
        env:
          VERSION: "${{ inputs.version }}"
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.(0|[1-9][0-9]*)$ ]]
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./apps/backend/package.json').version")" = "$VERSION"
          git fetch --no-tags --depth=1 origin main
          test "$(git show FETCH_HEAD:package.json | jq -r .version)" = "$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.platform }} natively"
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "linux/amd64"
            arch: "amd64"
            runner: "ubuntu-24.04"
            runner_arch: "X64"
          - platform: "linux/arm64"
            arch: "arm64"
            runner: "ubuntu-24.04-arm"
            runner_arch: "ARM64"
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout resolved source"
        uses: "actions/checkout@v7"
        with:
          ref: "${{ needs.resolve-source.outputs.source_sha }}"

      - name: "Verify native runner"
        shell: bash
        env:
          EXPECTED_ARCH: "${{ matrix.runner_arch }}"
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Login to GitHub Container Registry"
        uses: "docker/login-action@v4"
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build and push platform digest"
        id: build
        uses: "docker/build-push-action@v7"
        with:
          context: .
          file: docker/prod/Dockerfile
          platforms: "${{ matrix.platform }}"
          outputs: "type=image,name=ghcr.io/fastybird/smart-panel,push-by-digest=true,name-canonical=true,push=true"
          cache-from: "type=gha,scope=docker-${{ matrix.arch }}"
          cache-to: "type=gha,mode=max,scope=docker-${{ matrix.arch }}"

      - name: "Verify built package version"
        shell: bash
        env:
          DIGEST: "${{ steps.build.outputs.digest }}"
          PLATFORM: "${{ matrix.platform }}"
          VERSION: "${{ inputs.version }}"
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          actual="$(docker run --rm --platform "$PLATFORM" --entrypoint node \
            "ghcr.io/fastybird/smart-panel@$DIGEST" \
            -p "require('/app/package.json').version")"
          test "$actual" = "$VERSION"

      - name: "Retain platform digest"
        shell: bash
        env:
          ARCH: "${{ matrix.arch }}"
          DIGEST: "${{ steps.build.outputs.digest }}"
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: "Upload platform digest"
        uses: "actions/upload-artifact@v4"
        with:
          name: "docker-digest-${{ matrix.arch }}"
          path: "${{ runner.temp }}/digests/${{ matrix.arch }}"
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-manifest:
    name: "Publish verified multi-platform manifest"
    needs: [resolve-source, build]
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout current main"
        uses: "actions/checkout@v7"
        with:
          ref: main
          fetch-depth: 0

      - name: "Guard current version and release tag"
        shell: bash
        env:
          VERSION: "${{ inputs.version }}"
          SOURCE_SHA: "${{ needs.resolve-source.outputs.source_sha }}"
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(git rev-parse "refs/tags/v${VERSION}^{}")" = "$SOURCE_SHA"

      - name: "Download platform digests"
        uses: "actions/download-artifact@v4"
        with:
          pattern: "docker-digest-*"
          path: "${{ runner.temp }}/digests"
          merge-multiple: true

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Login to GitHub Container Registry"
        uses: "docker/login-action@v4"
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Assemble and verify manifest"
        shell: bash
        env:
          VERSION: "${{ inputs.version }}"
          DIGEST_DIR: "${{ runner.temp }}/digests"
        run: |
          set -euo pipefail
          test "$(find "$DIGEST_DIR" -type f | wc -l | tr -d ' ')" = 2
          for arch in amd64 arm64; do
            test -s "$DIGEST_DIR/$arch"
            digest="$(cat "$DIGEST_DIR/$arch")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          image=ghcr.io/fastybird/smart-panel
          amd64_digest="$(cat "$DIGEST_DIR/amd64")"
          arm64_digest="$(cat "$DIGEST_DIR/arm64")"
          docker buildx imagetools create --dry-run \
            "$image@$amd64_digest" "$image@$arm64_digest" | jq -e \
            '([.manifests[] | select(.platform.os == "linux") |
              .platform.architecture] | sort) == ["amd64", "arm64"]'
          docker buildx imagetools create \
            --tag "$image:alpha" \
            --tag "$image:$VERSION" \
            "$image@$amd64_digest" \
            "$image@$arm64_digest"
          docker buildx imagetools inspect --raw "$image:$VERSION" | jq -e \
            '([.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .platform.architecture] | sort) == ["amd64", "arm64"]'
          test "$(docker buildx imagetools inspect --raw "$image:alpha" | sha256sum | cut -d' ' -f1)" = \
            "$(docker buildx imagetools inspect --raw "$image:$VERSION" | sha256sum | cut -d' ' -f1)"
