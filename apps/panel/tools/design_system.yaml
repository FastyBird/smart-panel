# Design system checks (docs/display-ui-design-spec.md §1, §12).
#
# `dart run tools/check_design_system.dart` reads this file. Paths are relative
# to apps/panel and match by prefix: a folder ends with `/`, a file is its full
# path.
#
# Findings in a `strict` folder fail the check. Findings anywhere else are
# warnings. When a redesign task has migrated a folder, it adds the folder here
# in the same PR.
strict:
  - lib/features/gallery/
  # DR-5: the page header and its parts.
  - lib/core/widgets/page_header.dart
  - lib/core/widgets/icon_container.dart
  - lib/modules/devices/presentation/widgets/device_power_button.dart
  # DR-6: cards, the hero card, tiles and the offline treatment.
  - lib/core/widgets/base_card.dart
  - lib/core/widgets/hero_card.dart
  - lib/core/widgets/universal_tile.dart
  - lib/core/widgets/button_tile.dart
  - lib/core/widgets/tile_wrappers.dart
  - lib/core/widgets/offline_note.dart
  - lib/modules/devices/presentation/widgets/device_offline_overlay.dart
  # DR-7: the slider, switch, stepper, segmented control, mode chip and dial.
  - lib/core/widgets/control_colors.dart
  - lib/core/widgets/app_slider.dart
  - lib/core/widgets/app_switch.dart
  - lib/core/widgets/app_stepper.dart
  - lib/core/widgets/slider_with_steps.dart
  - lib/core/widgets/card_slider.dart
  - lib/core/widgets/icon_switch.dart
  - lib/core/widgets/value_selector.dart
  - lib/core/widgets/mode_selector.dart
  - lib/core/widgets/intent_mode_selector.dart
  - lib/core/widgets/circular_control_dial.dart
  - lib/features/settings/presentation/widgets/settings_slider.dart
  - lib/features/settings/presentation/widgets/settings_toggle.dart
  - lib/modules/deck/presentation/widgets/deck_mode_chip.dart
  - lib/modules/deck/presentation/widgets/deck_mode_popup.dart
  # DR-8: list rows, section labels, sheets, drawers, dialogs, toasts and banners.
  - lib/core/widgets/list_row.dart
  - lib/core/widgets/section_heading.dart
  - lib/core/widgets/bottom_sheet_dialog.dart
  - lib/core/widgets/right_drawer.dart
  - lib/core/widgets/app_dialog.dart
  - lib/core/widgets/toast.dart
  - lib/core/widgets/alert_banner.dart
  - lib/modules/deck/presentation/widgets/deck_item_sheet.dart
  - lib/modules/deck/presentation/widgets/deck_item_drawer.dart
  - lib/features/settings/presentation/widgets/settings_tile.dart
  - lib/features/settings/presentation/widgets/settings_card.dart
  - lib/features/settings/presentation/widgets/settings_card_surface.dart
  - lib/features/settings/presentation/widgets/settings_selection_dialog.dart
  # DR-9: state templates, loading skeletons and the outcome indicator.
  - lib/core/widgets/skeleton.dart
  - lib/core/widgets/outcome_indicator.dart
  - lib/core/widgets/outcome_details_sheet.dart
  - lib/modules/deck/presentation/widgets/domain_state_view.dart
  # DR-10: the deck bar and dock, All pages and the Settings entries.
  - lib/modules/deck/presentation/widgets/deck_nav_tab.dart
  - lib/modules/deck/presentation/widgets/deck_bottom_nav_bar.dart
  - lib/modules/deck/presentation/widgets/deck_side_dock.dart
  - lib/modules/deck/presentation/widgets/deck_more_sheet.dart
  # DR-11: the room overview, its widgets and the sky panel. The older sky
  # layers stay until DR-21 moves the weather detail onto the new sky.
  - lib/plugins/spaces-home-control/presentation/system_pages/room_overview.dart
  - lib/plugins/spaces-home-control/presentation/widgets/
  - lib/modules/deck/presentation/widgets/sky/sky_look.dart
  - lib/modules/deck/presentation/widgets/sky/sky_backdrop.dart
  - lib/modules/deck/presentation/widgets/sky/sky_panel.dart
  # DR-12: the Lights, Climate and Shading views and the grouped covers.
  # Their shared layout and the room temperature notice sit in widgets/.
  - lib/plugins/spaces-home-control/presentation/domain_pages/lights_domain_view.dart
  - lib/plugins/spaces-home-control/presentation/domain_pages/climate_domain_view.dart
  - lib/plugins/spaces-home-control/presentation/domain_pages/shading_domain_view.dart
  - lib/plugins/spaces-home-control/presentation/domain_pages/grouped_covers_room_controls.dart

# Generated code is never checked.
exclude:
  - lib/api/
  - lib/spec/
  - lib/l10n/
  - lib/mocks/
  - '*.g.dart'
  - '*.freezed.dart'
  - '*.mapper.dart'

# Files where a rule does not apply: the token classes themselves.
allow:
  hex-colour:
    - lib/core/utils/theme.dart
  font-size:
    - lib/core/utils/theme.dart
