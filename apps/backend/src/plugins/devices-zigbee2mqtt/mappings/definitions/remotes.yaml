# Zigbee2MQTT Remote Control and Button Mappings
# Handles remote controls, buttons, and devices with action/click events

version: "1.0"

mappings:
  # ============================================
  # SPECIFIC REMOTE CONTROLS
  # ============================================

  # Philips Hue Dimmer switch (RWL020, RWL021, RWL022, 324131092621)
  # 4 physical buttons: on, up, down, off
  - name: hue_dimmer
    description: "Philips Hue Dimmer Switch (4 buttons)"
    priority: 120
    match:
      all_of:
        - expose_type: enum
        - property: action
        - any_of:
            - model: RWL020
            - model: RWL021
            - model: RWL022
            - model: "324131092621"
    device_category: INPUT_CONTROLLER
    channels:
      - identifier: button_on
        name: On Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: button_up
        name: Up Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: button_down
        name: Down Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: button_off
        name: Off Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false

