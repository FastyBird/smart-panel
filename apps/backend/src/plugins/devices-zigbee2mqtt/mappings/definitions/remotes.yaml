  # 2 physical buttons: button_1, button_2
  - name: ikea_somrig
    description: "IKEA SOMRIG Shortcut Button (2 buttons)"
    priority: 120
    match:
      all_of:
        - expose_type: enum
        - property: action
        - any_of:
            - model: E2202
    device_category: INPUT_CONTROLLER
    channels:
      - identifier: button_1
        name: Button 1
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: button_2
        name: Button 2
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false

  # IKEA STYRBAR remote control (E2001, E2002)
  # 4 physical buttons: on, off, left, right
  - name: ikea_styrbar
    description: "IKEA STYRBAR Remote Control (4 buttons)"
    priority: 120
    match:
      all_of:
        - expose_type: enum
        - property: action
        - any_of:
            - model: E2001
            - model: E2002
    device_category: INPUT_CONTROLLER
    channels:
      - identifier: button_on
        name: On Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: button_off
        name: Off Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: button_left
        name: Left Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: button_right
        name: Right Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false

  # Rotary Dial / Smart Knob (e.g. Tuya Smart Knob ERS-10TZBVK-AA, TS004F, IKEA Symfonisk E1744, Philips Hue Tap Dial 8719514440937, 929003500201)
  # 2 physical controls: push button and rotary dial
  - name: rotary_dial_remote
    description: "Rotary dial and button controller"
    priority: 120
    match:
      all_of:
        - expose_type: enum
        - property: action
        - any_of:
            - model: ERS-10TZBVK-AA
            - model: TS004F
            - model: E1744
            - model: "8719514440937"
            - model: "929003500201"
    device_category: INPUT_CONTROLLER
    channels:
      - identifier: button
        name: Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
      - identifier: rotary
        name: Rotary Dial
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Dial Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
                - rotate_left
                - rotate_right
              settable: false
              queryable: false

  # Generic Multi-Endpoint Remote (matches exposes that have an endpoint or are list elements)
  - name: generic_endpoint_button
    description: "Multi-endpoint remote button"
    priority: 60
    match:
      all_of:
        - expose_type: enum
        - property: action
        - is_list: true
    device_category: INPUT_CONTROLLER
    channels:
      - identifier: "button_{endpoint}"
        name: "Button {endpoint}"
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false

  # Generic single button action event (Sonoff SNZB-01, Aqara Wireless Mini Switch WXKG11LM, etc.)
  - name: action_event
    description: "Remote control or button action event"
    priority: 50
    match:
      expose_type: enum
      property: action
    device_category: INPUT_CONTROLLER
    channels:
      - identifier: button
        name: Button
        category: BUTTON
        properties:
          - z2m_property: action
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false

  # Generic click event (alternative naming used by some legacy devices)
  - name: click_event
    description: "Button click event"
    priority: 50
    match:
      expose_type: enum
      property: click
    device_category: INPUT_CONTROLLER
    channels:
      - identifier: button
        name: Button
        category: BUTTON
        properties:
          - z2m_property: click
            direction: event_only
            panel:
              identifier: EVENT
              name: Event
              data_type: ENUM
              format:
                - press
                - double_press
                - triple_press
                - long_press
                - release
                - down
                - up
              settable: false
              queryable: false
