<!DOCTYPE html>
<html lang="en" class="h-full min-h-full max-h-full w-full min-w-full max-w-full m-0 p-0">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Same dynamic <base href> as index.html, so SVG url(#...) references (edge markers, background pattern)
      // are exercised under the conditions of the real admin page.
      (function() {
        var m = window.location.pathname.match(/^(\/api\/hassio_ingress\/[^/]+\/)/);
        var b = document.createElement('base');
        b.href = m ? m[1] : '/';
        document.head.appendChild(b);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AU-0 spike: automation canvas</title>
  </head>
  <body class="h-full min-h-full max-h-full w-full min-w-full max-w-full m-0 p-0">
    <div id="app" class="h-full min-h-full max-h-full w-full min-w-full max-w-full m-0 p-0"></div>
    <script type="module" src="/src/spike.main.ts"></script>
  </body>
</html>
